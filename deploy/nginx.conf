# nginx in front of the program: static pages from dist, /api/ to php-fpm (the "app" containers; docker resolves
# the name to every replica, nginx re-resolves it every 10 s).
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 600m;       # a backup ZIP is sent as the request body
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # the pages (clean addresses like /sign-in, as .htaccess does for Apache)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";   # names carry a ?v= version, so a new version is a new address
    }

    # the program: everything under /api/ goes to index.php
    location /api/ {
        set $upstream app:9000;
        fastcgi_pass $upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 300s;
        fastcgi_buffering off;       # backups and photos stream through
    }
}
