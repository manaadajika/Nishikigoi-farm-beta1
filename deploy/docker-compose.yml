# Program on several servers: web (nginx) + app (php-fpm, scale it) + worker + MySQL + Redis.
#
#   cp deploy/.env.example deploy/.env      (set the passwords)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build --scale app=3
#
# Not tested with Docker itself. The same pieces were tested without it: two PHP servers behind an nginx load balancer sharing
# the database and a Redis cache.
#
# Photos: with the default (local) storage every app and the worker must see the same uploads folder, so the volume below is shared;
# with an S3 bucket (KOI_STORAGE_DRIVER=s3 and the KOI_S3_* variables) no shared folder is needed for photos.

x-app-env: &app-env
  KOI_DB_HOST: db
  KOI_DB_NAME: nishikigoi_koi
  KOI_DB_USER: nishikigoi
  KOI_DB_PASS: ${DB_PASSWORD}
  KOI_DB_PERSISTENT: "true"
  KOI_CACHE_DRIVER: redis
  KOI_REDIS_HOST: redis
  KOI_TRUSTED_PROXIES: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
  KOI_UPLOADS_DIR: /var/www/uploads
  KOI_BACKUPS_DIR: /var/www/storage/backups
  KOI_LOGS_DIR: /var/www/storage/logs
  # KOI_STORAGE_DRIVER: s3
  # KOI_S3_ENDPOINT: https://s3.example.com
  # KOI_S3_BUCKET: nishikigoi
  # KOI_S3_KEY: ...
  # KOI_S3_SECRET: ...
  # KOI_S3_PUBLIC_BASE: https://media.example.com

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: nishikigoi_koi
      MYSQL_USER: nishikigoi
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ../api-php/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    command: ["--max-connections=400", "--innodb-buffer-pool-size=1G"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment: *app-env
    volumes:
      - uploads:/var/www/uploads
      - storage:/var/www/storage
    depends_on: [db, redis]

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["php", "bin/worker.php", "--loop"]
    environment: *app-env
    volumes:
      - uploads:/var/www/uploads
      - storage:/var/www/storage
    depends_on: [db, redis]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../app/public/Nishikigoi-beta/preview/dist:/usr/share/nginx/html:ro
    depends_on: [app]

volumes:
  dbdata:
  uploads:
  storage:
