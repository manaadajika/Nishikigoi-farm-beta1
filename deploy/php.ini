; php settings of the program containers
memory_limit = 512M
post_max_size = 512M
upload_max_filesize = 512M
max_execution_time = 300
date.timezone = Asia/Jakarta
display_errors = Off
log_errors = On

; opcache: the program is about 12,000 lines of PHP; without opcache every request parses all of it (about 25 ms)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 0
