# A load balancer in front of several program servers (no Docker): copy to nginx's conf.d and list your servers.
# Every server runs the same program against the same database / Redis (and the same S3 bucket or shared uploads folder).
# The program keeps no state on a server (sessions live in the database, lists in Redis), so any server can answer any request:
# no sticky sessions are needed. Set 'trusted_proxies' (KOI_TRUSTED_PROXIES) on the servers to this balancer's address, so the rate
# limit counts each visitor instead of the balancer.
upstream nishikigoi_app {
    least_conn;
    server 10.0.0.11:80 max_fails=2 fail_timeout=10s;
    server 10.0.0.12:80 max_fails=2 fail_timeout=10s;
    server 10.0.0.13:80 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    server_name koi.example.com;
    client_max_body_size 600m;

    location / {
        proxy_pass http://nishikigoi_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # the balancer's own health page for monitors: asks a server whether it can reach the database
    location = /ready {
        proxy_pass http://nishikigoi_app/api/ready;
    }
}
